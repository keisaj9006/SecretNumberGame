<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Number Game</title>
    <style> 
      .game {
        color: rgb(5, 66, 46);
        display: flex;
        font-size: larger;
        flex-direction: column;
        align-items: center;
        margin-top: 50px;
      }
      .input-area {
        margin-bottom: 20px;
      }
      .input-area input {
        font-size: 16px;
        padding: 5px;
        margin-right: 10px;
      }
      button {
        font-size: 16px;
        padding: 5px 10px;
        color: rgb(190, 206, 206);
        background-color: black;
      }
      .result {
        margin-top: 20px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="game">
      <h1>Guess the Secret Number</h1>
      <div class="input-area">
        <input type="number" id="guessNumber" placeholder="Enter your number"/>
        <button id="submit">Submit</button>
      </div>
      <div class="result" id="result">Guess the Number!</div>
    </div>
    <script>
      //we need to generate the number between 1 and 100 (math.random is giving us just between 0 and 1)
      const secretNumber = Math.floor(Math.random() * 100) + 1;
      //we need to get specific HTML elements as below
      const guessInput = document.getElementById("guessNumber");
      const resultBox = document.getElementById("result");
      const submitButton = document.getElementById("submit");

      // Handle the guess submission
      submitButton.addEventListener("click", () => {
        const guess = parseInt(guessInput.value);
        // it has to be the number and between 1 -100, we are also validating the input
        if (isNaN(guess) || guess < 1 || guess > 100) {
          resultBox.textContent = "Please, enter a valid number between 1 and 100.";
          return;
        }
        //we need to compare the guessNumber with the correct number (secretNumber)
        if (guess < secretNumber) {
          resultBox.textContent = `You answered ${guess}. The correct answer is higher.`;
        } else if (guess > secretNumber) {
          resultBox.textContent = `You answered ${guess}. The correct answer is lower.`;
        } else {
          resultBox.textContent = `You answered ${guess}. This is the correct answer!`;
        };
      });
    </script>
  </body>
</html>
